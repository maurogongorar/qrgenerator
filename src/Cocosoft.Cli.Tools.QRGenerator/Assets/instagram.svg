<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="igGradient" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%"   stop-color="#FFD600"/>
      <stop offset="22%"  stop-color="#FF7A00"/>
      <stop offset="48%"  stop-color="#FF0069"/>
      <stop offset="72%"  stop-color="#D300C5"/>
      <stop offset="100%" stop-color="#7638FA"/>
    </linearGradient>
  </defs>

  <!-- Instagram outer camera frame -->
  <rect x="105" y="105" width="590" height="590" rx="155"
        fill="none"
        stroke="url(#igGradient)"
        stroke-width="78"
        stroke-linejoin="round"/>

  <!-- Instagram lens -->
  <circle cx="400" cy="400" r="145"
          fill="none"
          stroke="url(#igGradient)"
          stroke-width="76"/>

  <!-- Upper-right camera dot -->
  <circle cx="575" cy="225" r="48"
          fill="url(#igGradient)"/>
</svg>
